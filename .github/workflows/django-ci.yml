name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: "Python Testleri ve Kod Kalite Kontrolü"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: "ci-is-safe-with-this-dummy-key"
      DEBUG: "True"

    steps:
    - name: "Kodu Checkout Et"
      uses: actions/checkout@v4
    
    - name: "Python 3.12 Ortamını Kur"
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: "Gerekli Paketleri Yükle (pip)"
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        # Eğer requirements.txt içinde pgvector yoksa hata alırsınız, kontrol edin.
        pip install -r requirements.txt
        
    - name: "Kod Stilini Denetle (Ruff)"
      run: |
        # --exit-zero derseniz hata olsa bile iş akışı devam eder, 
        # ancak hataları görüp düzeltmek için normal çalıştırmak en iyisidir.
        ruff check .
        
    - name: "Migration Uyumluluğunu Kontrol Et"
      run: |
        # Veritabanı bağlantısı için birkaç saniye bekleme ekliyoruz
        sleep 5
        python manage.py makemigrations --check
        
    - name: "Django Testlerini Koş"
      run: |
        # Testlerin çalışması için veritabanında pgvector kurulu olmalı.
        python manage.py test

  build-docker:
    name: "Docker İmajı Oluşturma Testi"
    runs-on: ubuntu-latest
    steps:
    - name: "Kodu Checkout Et"
      uses: actions/checkout@v4
    
    - name: "Docker İmajını İnşa Et (Build)"
      run: |
        docker build -t chatbot-web:latest .