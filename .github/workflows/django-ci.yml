# ==============================================================================
# PARÇALI BULUT - GELİŞTİRİLMİŞ CI/CD YAPILANDIRMASI
# ==============================================================================
# Bu dosya, GitHub üzerinde kodun her değişiminde otomatik olarak çalışır.
# Amacı: Kodun bozulup bozulmadığını, kütüphanelerin yüklenebilirliğini
# ve temel Django yapısının doğruluğunu kontrol etmektir.
# ------------------------------------------------------------------------------

name: Django CI/CD Pipeline

# İŞ AKIŞI TETİKLEYİCİLERİ
on:
  push:
    branches: [ "main", "master" ] # Ana dallara kod gönderildiğinde çalışır.
  pull_request:
    branches: [ "main", "master" ] # Çekme isteklerinde (PR) otomatik denetim yapar.

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: TEMEL KONTROLLER (Hızlı ve Güvenli Testler)
  # ----------------------------------------------------------------------------
  base_checks:
    name: "Python ve Django Temel Doğrulama"
    runs-on: ubuntu-latest # İşlemler en güncel Ubuntu sunucusu üzerinde koşar.

    # Django'nun çalışabilmesi için geçici çevre değişkenleri:
    env:
      SECRET_KEY: "gecici-guvenlik-anahtari-test-icin"
      DEBUG: "True"
      # Veritabanı hatası almamak için CI ortamında SQLite kullanılması önerilir.

    steps:
    # 1. ADIM: GitHub üzerindeki kodlarını sanal makineye indirir.
    - name: "1. Kodu Repodan Çek (Checkout)"
      uses: actions/checkout@v4

    # 2. ADIM: Belirlediğimiz Python sürümünü sisteme kurar.
    - name: "2. Python 3.12 Kurulumu"
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # 3. ADIM: Projenin çalışması için gereken tüm kütüphaneleri yükler.
    - name: "3. Bağımlılıkların Yüklenmesi (pip)"
      run: |
        python -m pip install --upgrade pip
        # requirements.txt içindeki paketlerin kurulumu test edilir.
        pip install -r requirements.txt

    # 4. ADIM: Django'nun genel sistem kontrolü.
    # Bu adım; settings, modeller ve genel yapıda hata olup olmadığına bakar.
    - name: "4. Django Sistem Sağlık Kontrolü (Check)"
      run: |
        python manage.py check

    # 5. ADIM: Modellerde yapılan değişikliklerin migration dosyalarına yansıtılıp
    # yansıtılmadığını kontrol eder. Unutulan bir migration varsa hata verir.
    - name: "5. Migration Uyumluluk Testi"
      run: |
        python manage.py makemigrations --check --dry-run

    # 6. ADIM: Proje içindeki statik dosyaların (CSS, JS) toplanabilirliğini denetler.
    # Statik dosya yapısında hata varsa burada yakalanır.
    - name: "6. Statik Dosya Toplama Testi (Collectstatic)"
      run: |
        python manage.py collectstatic --noinput --dry-run

  # ----------------------------------------------------------------------------
  # JOB 2: PAKETLEME KONTROLÜ (Docker Testi)
  # ----------------------------------------------------------------------------
  docker_build:
    name: "Docker İmajı Hazırlama Denetimi"
    runs-on: ubuntu-latest
    # Bu işin (job) çalışması için yukarıdaki 'base_checks' işinin başarıyla bitmesi gerekir:
    needs: base_checks

    steps:
    - name: "Kodu Checkout Et"
      uses: actions/checkout@v4

    # Adım: Dockerfile dosyasının doğru yazılıp yazılmadığını kontrol eder.
    # Eğer imaj başarılı oluşursa, canlı ortama çıkmaya hazır demektir.
    - name: "Docker İmajını İnşa Et (Build)"
      run: |
        docker build -t parcali-bulut-app:test .