# ==============================================================================
# PARÇALI BULUT - ULTRA GÜVENLİ VE BASİT TEST SÜRECİ
# ==============================================================================
name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "burak-ci/cd" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  everything:
    name: "Sistem ve Paket Kontrolü"
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "gecici-key"
      DEBUG: "True"
      DB_NAME: "test_db"
      DB_USER: "postgres"
      DB_PASSWORD: "password"
      DB_HOST: "localhost"
      DB_PORT: "5432"

    services:
      db:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: "1. Kodu Al"
      uses: actions/checkout@v4

    - name: "2. Python'u Kur"
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: "3. Sistem Paketlerini Güncelle"
      # Eğer hata 'psycopg2' kaynaklıysa bu adım sorunu çözer.
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev gcc python3-dev

    - name: "4. Temel Paketleri Kur (pip)"
      run: |
        python -m pip install --upgrade pip
        # Sadece requirements.txt içindekileri kurmaya çalışıyoruz.
        # Eğer burada hata alırsan requirements.txt dosyanı kontrol etmelisin.
        pip install -r requirements.txt

    - name: "5. Django Ayar Kontrolü"
      # Veritabanına hiç dokunmadan sadece settings.py kontrolü yapar.
      run: |
        python manage.py check

    - name: "6. Migration Dosya Kontrolü"
      # Model değişikliği var mı yok mu diye bakar.
      run: |
        python manage.py makemigrations --check --dry-run

    - name: "7. Django Testlerini Çalıştır"
      # chat/tests.py ve diğer uygulamalardaki testleri koşturur.
      run: |
        python manage.py test

    - name: "8. Docker Yapılandırma Kontrolü"
      # En azından imajın oluşup oluşmadığını doğrular.
      run: |
        docker build -t test-image .