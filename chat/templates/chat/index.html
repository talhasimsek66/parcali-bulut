<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acıbadem AI Asistanı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            /* Renk Paleti (Modern Koyu Tema) */
            --bg-main: #0f172a;       /* Arka plan */
            --bg-sidebar: #1e293b;    /* Yan menü */
            --bg-chat: #0f172a;       /* Chat alanı */
            --bg-surface: #1e293b;    /* Kartlar ve input */
            
            --primary: #0ea5e9;       /* Acıbadem Mavisi Aksan */
            --primary-hover: #0284c7;
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            
            --msg-user: #1e293b;
            --msg-ai: transparent;
            
            --radius-lg: 24px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SOL MENÜ (SIDEBAR) --- */
        .sidebar {
            width: 280px;
            min-width: 0;
            flex-shrink: 0;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease, opacity 0.25s ease, border-color 0.25s ease, transform 0.3s ease;
            z-index: 20;
            overflow: hidden;
        }

        body.sidebar-collapsed .sidebar {
            width: 0;
            opacity: 0;
            border-right-color: transparent;
            pointer-events: none;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header i {
            color: var(--primary);
            font-size: 1.4rem;
        }

        .new-chat-btn {
            margin: 20px;
            padding: 12px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2);
        }

        .new-chat-btn:hover { background: var(--primary-hover); }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 20px 10px;
        }

        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        .history-item {
            position: relative;
            padding: 8px 10px 8px 12px;
            margin-bottom: 4px;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s, color 0.2s;
            overflow: visible;
        }

        .history-item-main {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0 4px 4px;
            cursor: pointer;
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .history-item-main > i { font-size: 0.85rem; flex-shrink: 0; }

        .history-item-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item-menu-wrap {
            position: relative;
            flex-shrink: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        .history-item:hover .history-item-menu-wrap,
        .history-item:focus-within .history-item-menu-wrap {
            opacity: 1;
            pointer-events: auto;
        }

        @media (hover: none) and (pointer: coarse) {
            .history-item-menu-wrap {
                opacity: 1;
                pointer-events: auto;
            }
        }

        .history-item-kebab {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .history-item-kebab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        .history-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 2px;
            min-width: 132px;
            padding: 4px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
            z-index: 50;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.12s ease, visibility 0.12s ease;
        }

        .history-item-menu-wrap:hover .history-dropdown {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .history-delete-btn {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            border: none;
            border-radius: 6px;
            background: none;
            color: var(--text-main);
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: inherit;
        }

        .history-delete-btn:hover {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
        }

        .history-delete-btn i { font-size: 0.85rem; width: 1em; text-align: center; }

        .history-item:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-main); }
        .history-item.active { background: var(--bg-surface); color: var(--text-main); font-weight: 500; border: 1px solid var(--border-color); }

        /* --- ANA SOHBET ALANI --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .top-nav {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .menu-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: rgba(30, 41, 59, 0.75);
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
        }

        .menu-toggle:hover {
            border-color: var(--primary);
            color: var(--text-main);
            background: rgba(30, 41, 59, 0.95);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 15%;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        .message-row {
            display: flex;
            margin-bottom: 30px;
            width: 100%;
        }

        .message-row.user { justify-content: flex-end; }
        .message-row.ai { justify-content: flex-start; }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
            font-size: 1.1rem;
        }

        .ai .message-avatar { background: var(--primary); color: white; }
        .user .message-avatar { display: none; } /* Kullanıcı avatarını gizledik, balon sağda zaten */

        .message-bubble {
            max-width: 80%;
            padding: 16px 20px;
            font-size: 1rem;
            line-height: 1.6;
        }

        .user .message-bubble {
            background-color: var(--msg-user);
            border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
            border: 1px solid var(--border-color);
        }

        .ai .message-bubble {
            background-color: var(--msg-ai);
            border-radius: var(--radius-md);
            /* AI mesajı şeffaf arkaplan, daha makalevari bir okuma sunar */
        }

        /* Markdown Tasarımları */
        .message-bubble p { margin-bottom: 12px; }
        .message-bubble p:last-child { margin-bottom: 0; }
        .message-bubble strong { color: #fff; }
        .message-bubble ul, .message-bubble ol { margin-bottom: 12px; padding-left: 20px; }
        .message-bubble pre {
            background: #000;
            padding: 12px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid var(--border-color);
        }
        .message-bubble code {
            font-family: 'Courier New', Courier, monospace;
            color: #38bdf8;
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .message-bubble pre code { background: transparent; padding: 0; color: #e2e8f0; }

        /* --- İNPUT ALANI --- */
        .input-wrapper {
            padding: 20px 15%;
            background: linear-gradient(to top, var(--bg-main) 70%, transparent);
        }

        .input-box {
            position: relative;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 5px 5px 5px 20px;
            display: flex;
            align-items: flex-end;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s;
        }

        .input-box:focus-within { border-color: var(--primary); }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            line-height: 1.5;
            padding: 12px 0;
            resize: none;
            outline: none;
            max-height: 150px;
            overflow-y: auto;
        }

        textarea::placeholder { color: var(--text-muted); }
        textarea::-webkit-scrollbar { display: none; }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 10px;
            transition: transform 0.2s, background 0.2s;
            flex-shrink: 0;
            margin-bottom: 3px;
        }

        .send-btn:hover { background: var(--primary-hover); transform: scale(1.05); }
        .send-btn:disabled { background: var(--border-color); cursor: not-allowed; transform: none; }

        /* Loading Animasyonu */
        .typing { display: flex; gap: 4px; padding: 10px 0; }
        .typing span {
            width: 6px; height: 6px; background: var(--text-muted);
            border-radius: 50%; animation: blink 1.4s infinite both;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

        /* Mobil Uyum */
        @media (max-width: 850px) {
            .chat-container, .input-wrapper { padding-left: 5%; padding-right: 5%; }
            .sidebar {
                position: absolute;
                height: 100%;
                width: 280px;
                transform: translateX(-100%);
                opacity: 1;
                pointer-events: auto;
                border-right: 1px solid var(--border-color);
            }
            .sidebar.open {
                transform: translateX(0);
                box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5);
            }
            body.sidebar-collapsed .sidebar {
                width: 280px;
                opacity: 1;
                pointer-events: auto;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Acıbadem AI</span>
        </div>
        
        <button class="new-chat-btn" onclick="startNewChat()">
            <i class="fa-solid fa-plus"></i> Yeni Sohbet
        </button>

        <div class="history-list" id="historyList">
            {% for s in sessions %}
            <div class="history-item" id="item-{{ s.id }}">
                <div class="history-item-main" onclick="loadChat('{{ s.id }}')">
                    <i class="fa-regular fa-message"></i>
                    <span class="history-item-title">{{ s.title }}</span>
                </div>
                <div class="history-item-menu-wrap" onclick="event.stopPropagation()">
                    <button type="button" class="history-item-kebab" aria-label="Sohbet seçenekleri">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div class="history-dropdown">
                        <button type="button" class="history-delete-btn" onclick="deleteSession('{{ s.id }}', event)">
                            <i class="fa-solid fa-trash"></i>
                            Sil
                        </button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </aside>

    <main class="main-content">
        <div class="top-nav">
            <button type="button" class="menu-toggle" id="menuToggleBtn" onclick="toggleSidebar()" aria-label="Yan menüyü aç veya kapat" aria-expanded="true">
                <i class="fa-solid fa-bars" id="menuToggleIcon"></i>
            </button>
            <span style="font-weight: 500; font-size: 1.1rem; color: var(--text-muted);">Asistan</span>
        </div>

        <div class="chat-container" id="chatBox">
            <div class="message-row ai">
                <div class="message-avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="message-bubble">
                    <p>Merhaba! Ben Acıbadem Üniversitesi Yapay Zeka Asistanıyım.</p>
                    <p>Size üniversite programları, kayıtlar, ders içerikleri veya iletişim bilgileri hakkında nasıl yardımcı olabilirim?</p>
                </div>
            </div>
        </div>

        <div class="input-wrapper">
            <div class="input-box">
                <textarea id="userInput" rows="1" placeholder="Asistan'a soru sorun..." oninput="autoResize(this)" onkeydown="handleKeyPress(event)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const sidebar = document.getElementById('sidebar');
        const menuToggleIcon = document.getElementById('menuToggleIcon');
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        let currentSessionId = null;

        function isMobileLayout() {
            return window.innerWidth <= 850;
        }

        function syncSidebarToggleUi() {
            if (!menuToggleBtn || !menuToggleIcon) return;
            if (isMobileLayout()) {
                const open = sidebar.classList.contains('open');
                menuToggleBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
                menuToggleIcon.className = open ? 'fa-solid fa-xmark' : 'fa-solid fa-bars';
            } else {
                const collapsed = document.body.classList.contains('sidebar-collapsed');
                menuToggleBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                menuToggleIcon.className = collapsed ? 'fa-solid fa-bars' : 'fa-solid fa-angles-left';
            }
        }

        // Masaüstü: sidebar daralt / genişlet. Mobil: üst üste drawer aç/kapa.
        function toggleSidebar() {
            if (isMobileLayout()) {
                sidebar.classList.toggle('open');
            } else {
                document.body.classList.toggle('sidebar-collapsed');
            }
            syncSidebarToggleUi();
        }

        function closeSidebarMobile() {
            if (!isMobileLayout()) return;
            sidebar.classList.remove('open');
            syncSidebarToggleUi();
        }

        window.addEventListener('resize', () => {
            if (isMobileLayout()) {
                document.body.classList.remove('sidebar-collapsed');
            } else {
                sidebar.classList.remove('open');
            }
            syncSidebarToggleUi();
        });

        syncSidebarToggleUi();

        // Textarea otomatik boyutlandırma
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 150) + 'px';
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function deleteSession(id, ev) {
            ev.stopPropagation();
            try {
                const response = await fetch(`/api/session/${id}/`, { method: 'DELETE' });
                if (!response.ok && response.status !== 404) return;
                document.getElementById(`item-${id}`)?.remove();
                if (currentSessionId === id) {
                    currentSessionId = null;
                    startNewChat();
                }
            } catch (_) { /* sessiz */ }
        }

        function startNewChat() {
            currentSessionId = null;
            chatBox.innerHTML = `
                <div class="message-row ai">
                    <div class="message-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="message-bubble"><p>Yeni bir sohbet başlattınız. Sizi dinliyorum.</p></div>
                </div>`;
            document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
            closeSidebarMobile();
        }

        async function loadChat(id) {
            currentSessionId = id;
            document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
            document.getElementById(`item-${id}`).classList.add('active');
            
            closeSidebarMobile();

            chatBox.innerHTML = '<div style="text-align:center; color: var(--text-muted); margin-top: 40px;"><div class="typing"><span></span><span></span><span></span></div></div>';
            
            try {
                const response = await fetch(`/api/history/${id}/`);
                const data = await response.json();
                
                chatBox.innerHTML = "";
                data.messages.forEach(m => {
                    appendUserMessage(m.user_message);
                    appendAIMessage(m.ai_response, true); // true = zaten markdown yapılmış
                });
                scrollToBottom();
            } catch (error) {
                chatBox.innerHTML = '<div style="color:#ef4444; text-align:center; margin-top: 20px;">Geçmiş yüklenemedi.</div>';
            }
        }

        function appendUserMessage(text) {
            const html = `
                <div class="message-row user">
                    <div class="message-bubble">${escapeHTML(text)}</div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', html);
        }

        function appendAIMessage(text, isParsed=false) {
            const content = isParsed ? marked.parse(text) : text;
            const html = `
                <div class="message-row ai">
                    <div class="message-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="message-bubble ai-content">${content}</div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', html);
            return chatBox.lastElementChild.querySelector('.ai-content');
        }

        function appendTypingIndicator() {
            const html = `
                <div class="message-row ai" id="typingIndicator">
                    <div class="message-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="message-bubble"><div class="typing"><span></span><span></span><span></span></div></div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', html);
        }

        async function sendMessage() {
            const question = userInput.value.trim();
            if (!question) return;

            // UI Durumunu kilitle
            userInput.value = "";
            autoResize(userInput);
            sendBtn.disabled = true;
            
            appendUserMessage(question);
            appendTypingIndicator();
            scrollToBottom();

            try {
                const response = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, session_id: currentSessionId })
                });

                document.getElementById('typingIndicator')?.remove();

                if (!response.ok) throw new Error("Sunucu hatası");

                const newSessionId = response.headers.get('X-Session-ID');
                const isFirstMessage = !currentSessionId && newSessionId;
                if (isFirstMessage) currentSessionId = newSessionId;

                const msgContentDiv = appendAIMessage(""); // Boş balon oluştur
                
                // Stream Okuma
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    fullText += decoder.decode(value, { stream: true });
                    msgContentDiv.innerHTML = marked.parse(fullText);
                    scrollToBottom();
                }

                if (isFirstMessage) {
                    setTimeout(() => location.reload(), 1500); 
                }

            } catch (error) {
                document.getElementById('typingIndicator')?.remove();
                appendAIMessage("<span style='color:#ef4444;'>Sunucuya bağlanılamadı veya bir hata oluştu.</span>");
            } finally {
                sendBtn.disabled = false;
                scrollToBottom();
            }
        }

        function handleKeyPress(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
