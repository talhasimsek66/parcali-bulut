<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acıbadem AI Asistanı</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --bg-color: #121212;
            --sidebar-bg: #161b22;
            --chat-bg: #1e1e1e;
            --user-msg-bg: #2b5278;
            --ai-msg-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --text-muted: #888888;
            --border-color: #333333;
            --border-radius: 16px;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            height: 100vh;
            display: flex;
            color: var(--text-color);
            overflow: hidden; /* Ekranın genelinde kaydırmayı kapat */
        }

        /* --- ANA DÜZEN --- */
        .main-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* --- SOL MENÜ (SIDEBAR) --- */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            transition: transform 0.3s ease;
        }

        .new-chat-btn {
            background: transparent;
            border: 1px solid #444;
            color: var(--text-color);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1em;
            font-weight: 600;
            margin-bottom: 20px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .new-chat-btn:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--text-muted);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .history-item {
            padding: 12px;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.9em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-color);
        }

        .history-item.active {
            background: #1f242c;
            color: var(--primary-color);
            border-left: 3px solid var(--primary-color);
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }

        /* --- SAĞ SOHBET ALANI --- */
        .chat-container { 
            flex: 1; 
            display: flex;
            flex-direction: column;
            background: var(--chat-bg); 
            height: 100vh;
            position: relative;
        }

        .header { 
            background: var(--sidebar-bg);
            color: #ffffff; 
            padding: 18px; 
            text-align: center; 
            font-size: 1.3em; 
            font-weight: 600; 
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        .chat-box { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px 10%; /* Yanlardan boşluk bırakarak ortalama */
            scroll-behavior: smooth;
        }

        .message-wrapper { display: flex; margin-bottom: 20px; width: 100%; }
        .message-wrapper.user { justify-content: flex-end; }
        .message-wrapper.ai { justify-content: flex-start; }

        .message { 
            max-width: 80%; 
            padding: 14px 18px; 
            border-radius: var(--border-radius); 
            line-height: 1.6; 
            font-size: 1em;
            color: var(--text-color);
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .user-msg { background-color: var(--user-msg-bg); border-bottom-right-radius: 4px; color: #ffffff; }
        .ai-msg { background-color: var(--ai-msg-bg); border-bottom-left-radius: 4px; }

        .ai-msg p { margin: 0 0 10px 0; }
        .ai-msg p:last-child { margin: 0; }
        .ai-msg ul, .ai-msg ol { margin: 5px 0; padding-left: 20px; }
        .ai-msg strong { color: #ffffff; font-weight: 700; }
        .ai-msg code { 
            background: #1a1a1a; color: #58a6ff; padding: 3px 6px; 
            border-radius: 6px; font-family: 'Courier New', monospace; font-size: 0.9em; border: 1px solid #333;
        }

        .input-area { 
            display: flex; padding: 20px 10%; background: var(--sidebar-bg); 
            border-top: 1px solid var(--border-color); align-items: flex-end; gap: 12px;
        }

        textarea { 
            flex: 1; padding: 14px 16px; background: #0d1117; color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 20px; outline: none; 
            resize: none; font-family: inherit; font-size: 1em; min-height: 24px;
            max-height: 150px; overflow-y: auto; transition: all 0.3s ease;
        }

        textarea::placeholder { color: var(--text-muted); }
        textarea:focus { border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2); }

        button { 
            background: var(--primary-color); color: white; border: none; 
            padding: 0 24px; border-radius: 20px; cursor: pointer; 
            font-weight: 600; font-size: 1em; height: 50px; transition: background 0.2s, transform 0.1s;
        }

        button:hover { background: var(--primary-hover); }
        button:active { transform: scale(0.96); }

        .typing-indicator {
            display: none; padding: 16px 20px; background: var(--ai-msg-bg);
            border-radius: var(--border-radius); border-bottom-left-radius: 4px;
            align-items: center; width: fit-content; margin-bottom: 20px;
        }

        .dot { width: 8px; height: 8px; margin: 0 3px; background-color: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

        /* Mobil Cihazlar İçin Uyumluluk */
        @media (max-width: 768px) {
            .sidebar { display: none; /* Mobilde sol menüyü gizle (Geliştirilebilir) */ }
            .chat-box { padding: 15px; }
            .input-area { padding: 15px; }
            .message { max-width: 90%; }
        }
    </style>
</head>
<body>

<div class="main-layout">
    
    <div class="sidebar">
        <button class="new-chat-btn" onclick="startNewChat()">
            <span style="font-size: 1.2em;">+</span> Yeni Sohbet
        </button>
        
        <div class="history-list" id="historyList">
            {% for s in sessions %}
            <div class="history-item" onclick="loadChat('{{ s.id }}')" id="item-{{ s.id }}">
                {{ s.title }}
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="chat-container">
        <div class="header">Acıbadem AI Asistanı</div>
        
        <div class="chat-box" id="chatBox">
            <div class="message-wrapper ai">
                <div class="message ai-msg">Merhaba! Ben Acıbadem Üniversitesi yapay zeka asistanıyım. Size nasıl yardımcı olabilirim?</div>
            </div>
        </div>
        
        <div class="chat-box" style="padding-top: 0; padding-bottom: 0; flex: 0; overflow: visible; min-height: 0;">
            <div class="typing-indicator" id="typingIndicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="input-area">
            <textarea id="userInput" placeholder="Sorunuzu buraya yazın..." rows="1" oninput="autoResize(this)" onkeydown="handleKeyPress(event)"></textarea>
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>

</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const typingIndicator = document.getElementById('typingIndicator');
    
    // Aktif Sohbetin ID'si (Yeni sohbette null olur)
    let currentSessionId = null;

    // YENİ SOHBET BAŞLAT
    function startNewChat() {
        currentSessionId = null;
        chatBox.innerHTML = `
            <div class="message-wrapper ai">
                <div class="message ai-msg">Merhaba! Yeni bir konu hakkında yardımcı olabilirim.</div>
            </div>`;
        document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
    }

    // ESKİ SOHBETİ YÜKLE
    async function loadChat(id) {
        currentSessionId = id;
        document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
        document.getElementById(`item-${id}`).classList.add('active');
        
        chatBox.innerHTML = '<div style="text-align:center; color: var(--text-muted); margin-top: 20px;">Geçmiş yükleniyor...</div>';
        
        try {
            const response = await fetch(`/api/history/${id}/`);
            const data = await response.json();
            
            chatBox.innerHTML = "";
            data.messages.forEach(m => {
                chatBox.innerHTML += `
                    <div class="message-wrapper user">
                        <div class="message user-msg">${escapeHTML(m.user_message)}</div>
                    </div>`;
                chatBox.innerHTML += `
                    <div class="message-wrapper ai">
                        <div class="message ai-msg">${marked.parse(m.ai_response)}</div>
                    </div>`;
            });
            scrollToBottom();
        } catch (error) {
            chatBox.innerHTML = '<div style="color:#ff6b6b; text-align:center;">Geçmiş yüklenemedi.</div>';
        }
    }

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = (textarea.scrollHeight) + 'px';
        if(textarea.value === '') textarea.style.height = 'auto';
    }
    
    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // MESAJ GÖNDERME
    async function sendMessage() {
        const question = userInput.value.trim();
        if (question === "") return;
        
        chatBox.innerHTML += `
            <div class="message-wrapper user">
                <div class="message user-msg">${escapeHTML(question)}</div>
            </div>`;
        
        userInput.value = "";
        autoResize(userInput);
        scrollToBottom();
        typingIndicator.style.display = "flex";

        try {
            const response = await fetch('/api/chat/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // Backend'e aktif Session ID'yi de yolluyoruz
                body: JSON.stringify({ question: question, session_id: currentSessionId }) 
            });
            
            typingIndicator.style.display = "none";

            if (!response.ok) {
                throw new Error("Sunucu hatası");
            }

            // Yeni bir sohbet başlattıysak arka planda ID oluşmuştur, onu yakalayalım
            const newSessionId = response.headers.get('X-Session-ID');
            const isFirstMessage = !currentSessionId && newSessionId;
            if (isFirstMessage) {
                currentSessionId = newSessionId;
            }

            const msgWrapper = document.createElement('div');
            msgWrapper.className = 'message-wrapper ai';
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai-msg';
            msgWrapper.appendChild(msgDiv);
            chatBox.appendChild(msgWrapper);

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let fullText = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                fullText += chunk;
                
                msgDiv.innerHTML = marked.parse(fullText);
                scrollToBottom();
            }

            // Eğer bu yeni bir sohbetin ilk mesajıysa, sol menünün güncellenmesi için sayfayı yenile
            if (isFirstMessage) {
                setTimeout(() => {
                    location.reload(); 
                }, 1500); // Kullanıcı cevabı okuduktan 1.5 sn sonra yenilenir (Sidebar dolsun diye)
            }

        } catch (error) {
            typingIndicator.style.display = "none";
            chatBox.innerHTML += `
                <div class="message-wrapper ai">
                    <div class="message ai-msg" style="color:#ff6b6b; font-weight:bold;">Sunucuya bağlanılamadı veya bir hata oluştu.</div>
                </div>`;
            scrollToBottom();
        }
    }

    function handleKeyPress(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag)
        );
    }
</script>

</body>
</html>
