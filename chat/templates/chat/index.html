<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Acıbadem AI Asistanı</title>

    <style>
        body { margin:0; font-family: Arial; height:100vh; }
        .layout { display:flex; height:100%; }

        .sidebar {
            width:260px;
            background:#1e293b;
            color:white;
            padding:15px;
            overflow-y:auto;
        }

        .session-item {
            padding:10px;
            border-bottom:1px solid #334155;
            cursor:pointer;
        }

        .session-item:hover { background:#334155; }

        .main {
            flex:1;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#eef2f7;
        }

        .chat-container {
            width:650px;
            background:white;
            border-radius:10px;
            overflow:hidden;
        }

        .header {
            background:#004a8f;
            color:white;
            padding:15px;
            text-align:center;
        }

        .chat-box {
            height:400px;
            overflow-y:auto;
            padding:15px;
            display:flex;
            flex-direction:column;
        }

        .message {
            margin:5px 0;
            padding:10px;
            border-radius:10px;
            max-width:75%;
        }

        .user-msg { align-self:flex-end; background:#004a8f; color:white; }
        .ai-msg { align-self:flex-start; background:#e9f1fb; }

        .input-area {
            display:flex;
            padding:10px;
        }

        input { flex:1; padding:10px; }
        button { margin-left:10px; }

        .new-chat-btn {
            width:100%;
            padding:10px;
            margin-bottom:10px;
            background:#334155;
            color:white;
            border:none;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- 🔥 SIDEBAR -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="newChat()">➕ Yeni Sohbet</button>

        <h3>🗂 Sohbetler</h3>
        <div id="sessionsList"></div>
    </div>

    <!-- 🔥 CHAT -->
    <div class="main">
        <div class="chat-container">

            <div class="header">🤖 Acıbadem AI Asistanı</div>

            <div id="chatBox" class="chat-box">
                <div class="message ai-msg">
                    🤖 Merhaba! Size nasıl yardımcı olabilirim?
                </div>
            </div>

            <div class="input-area">
                <input id="userInput" placeholder="Sorunu yaz..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Gönder</button>
            </div>

        </div>
    </div>

</div>

<script>
let currentSessionId = null;

// 🔥 YENİ SOHBET
function newChat() {
    currentSessionId = null;

    const chat = document.getElementById('chatBox');
    chat.innerHTML = `
        <div class="message ai-msg">
            🤖 Merhaba! Size nasıl yardımcı olabilirim?
        </div>
    `;
}

// 🔥 SESSION LİSTESİ
async function loadSessions() {
    const res = await fetch('/api/sessions/');
    const data = await res.json();

    const list = document.getElementById('sessionsList');
    list.innerHTML = "";

    data.sessions.forEach(s => {
        const div = document.createElement("div");
        div.className = "session-item";
        div.innerText = s.title;

        div.onclick = () => {
            currentSessionId = s.id;
            loadMessages(s.id);
        };

        list.appendChild(div);
    });
}

// 🔥 MESAJLARI YÜKLE
async function loadMessages(sessionId) {
    const res = await fetch(`/api/session/${sessionId}/`);
    const data = await res.json();

    const chat = document.getElementById('chatBox');
    chat.innerHTML = "";

    data.messages.forEach(msg => {
        chat.innerHTML += `<div class="message user-msg">👤 ${msg.user}</div>`;
        chat.innerHTML += `<div class="message ai-msg">🤖 ${msg.ai}</div>`;
    });
}

// 🔥 MESAJ GÖNDER
async function sendMessage() {
    const input = document.getElementById('userInput');
    const chat = document.getElementById('chatBox');

    const question = input.value.trim();
    if (!question) return;

    chat.innerHTML += `<div class="message user-msg">👤 ${question}</div>`;
    input.value = "";

    // 🔥 düşünüyor efekti
    const loadingDiv = document.createElement("div");
    loadingDiv.className = "message ai-msg";
    loadingDiv.id = "loadingMsg";
    loadingDiv.innerText = "🤖 düşünüyor...";
    chat.appendChild(loadingDiv);

    const res = await fetch('/api/chat/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            question: question,
            session_id: currentSessionId
        })
    });

    const data = await res.json();

    document.getElementById("loadingMsg")?.remove();

    if (!currentSessionId) {
        currentSessionId = data.session_id;
        loadSessions();
    }

    chat.innerHTML += `<div class="message ai-msg">🤖 ${data.answer}</div>`;
    chat.scrollTop = chat.scrollHeight;
}

// enter
function handleKeyPress(e) {
    if (e.key === "Enter") sendMessage();
}

window.onload = loadSessions;
</script>

</body>
</html>
