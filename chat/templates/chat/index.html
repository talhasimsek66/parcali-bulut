<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acıbadem AI Asistanı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            /* Renk Paleti (Modern Koyu Tema) */
            --bg-main: #0f172a;       /* Arka plan */
            --bg-sidebar: #1e293b;    /* Yan menü */
            --bg-chat: #0f172a;       /* Chat alanı */
            --bg-surface: #1e293b;    /* Kartlar ve input */
            
            --primary: #0ea5e9;       /* Acıbadem Mavisi Aksan */
            --primary-hover: #0284c7;
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            
            --msg-user: #1e293b;
            --msg-ai: transparent;
            
            --radius-lg: 24px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SOL MENÜ (SIDEBAR) --- */
        .sidebar {
            width: 280px;
            min-width: 0;
            flex-shrink: 0;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease, opacity 0.25s ease, border-color 0.25s ease, transform 0.3s ease;
            z-index: 20;
            overflow: hidden;
        }

        body.sidebar-collapsed .sidebar {
            width: 0;
            opacity: 0;
            border-right-color: transparent;
            pointer-events: none;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header i {
            color: var(--primary);
            font-size: 1.4rem;
        }

        .new-chat-btn {
            margin: 20px;
            padding: 12px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2);
        }

        .new-chat-btn:hover { background: var(--primary-hover); }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 20px 10px;
        }

        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        .history-item {
            position: relative;
            padding: 8px 10px 8px 12px;
            margin-bottom: 4px;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s, color 0.2s;
            overflow: visible;
        }

        .history-item-main {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0 4px 4px;
            cursor: pointer;
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .history-item-main > i { font-size: 0.85rem; flex-shrink: 0; }

        .history-item-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item-menu-wrap {
            position: relative;
            flex-shrink: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        .history-item:hover .history-item-menu-wrap,
        .history-item:focus-within .history-item-menu-wrap {
            opacity: 1;
            pointer-events: auto;
        }

        @media (hover: none) and (pointer: coarse) {
            .history-item-menu-wrap {
                opacity: 1;
                pointer-events: auto;
            }
        }

        .history-item-kebab {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .history-item-kebab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        .history-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 2px;
            min-width: 132px;
            padding: 4px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
            z-index: 50;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.12s ease, visibility 0.12s ease;
        }

        .history-item-menu-wrap:hover .history-dropdown {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .history-delete-btn {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            border: none;
            border-radius: 6px;
            background: none;
            color: var(--text-main);
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: inherit;
        }

        .history-delete-btn:hover {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
        }

        .history-delete-btn i { font-size: 0.85rem; width: 1em; text-align: center; }

        .history-item:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-main); }
        .history-item.active { background: var(--bg-surface); color: var(--text-main); font-weight: 500; border: 1px solid var(--border-color); }

        .sidebar-footer {
            flex-shrink: 0;
            padding: 12px 16px 16px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-sidebar);
        }

        .faq-sidebar-btn {
            width: 100%;
            padding: 11px 14px;
            background: rgba(14, 165, 233, 0.12);
            color: var(--primary);
            border: 1px solid rgba(14, 165, 233, 0.35);
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            font-family: inherit;
        }

        .faq-sidebar-btn:hover {
            background: rgba(14, 165, 233, 0.2);
            border-color: var(--primary);
            color: #7dd3fc;
        }

        .faq-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .faq-modal-backdrop.is-open {
            display: flex;
        }

        .faq-modal-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 22px 22px 18px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
        }

        .faq-modal-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .faq-modal-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.35;
        }

        .faq-modal-sub {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .faq-modal-close {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
        }

        .faq-modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .faq-q-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .faq-q-btn {
            width: 100%;
            text-align: left;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.5);
            color: var(--text-main);
            font-size: 0.9rem;
            line-height: 1.45;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            font-family: inherit;
        }

        .faq-q-btn:hover {
            border-color: var(--primary);
            background: rgba(14, 165, 233, 0.1);
        }

        /* --- ANA SOHBET ALANI --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .top-nav {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .menu-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: rgba(30, 41, 59, 0.75);
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
        }

        .menu-toggle:hover {
            border-color: var(--primary);
            color: var(--text-main);
            background: rgba(30, 41, 59, 0.95);
        }

        .top-nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .export-chat-btn {
            margin-left: auto;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: rgba(30, 41, 59, 0.6);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }

        .export-chat-btn:hover {
            border-color: var(--primary);
            color: var(--text-main);
            background: rgba(14, 165, 233, 0.12);
        }

        .export-chat-btn i {
            font-size: 0.95rem;
            color: var(--primary);
        }

        .export-chat-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }

        .export-toast {
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            z-index: 300;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 0.88rem;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            max-width: min(90vw, 420px);
            text-align: center;
        }

        .export-toast.is-visible {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 520px) {
            .export-chat-btn .export-chat-btn-label {
                display: none;
            }
            .export-chat-btn {
                padding: 8px 10px;
            }
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 15%;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        .message-row {
            display: flex;
            margin-bottom: 30px;
            width: 100%;
        }

        .message-row.user { justify-content: flex-end; }
        .message-row.ai { justify-content: flex-start; }

        .message-column {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 80%;
            min-width: 0;
            gap: 6px;
        }

        .message-row.user .message-column {
            align-items: flex-end;
            margin-left: auto;
        }

        .msg-copy-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            line-height: 1;
            transition: color 0.15s, background 0.15s;
        }

        .msg-copy-btn:hover {
            color: var(--primary);
            background: rgba(255, 255, 255, 0.06);
        }

        .msg-copy-btn.copied {
            color: #4ade80;
        }

        .msg-actions-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 2px;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
            font-size: 1.1rem;
        }

        .ai .message-avatar { background: var(--primary); color: white; }
        .user .message-avatar { display: none; } /* Kullanıcı avatarını gizledik, balon sağda zaten */

        .message-bubble {
            display: inline-block;
            box-sizing: border-box;
            min-width: 0;
            max-width: 100%;
            vertical-align: top;
            padding: 16px 20px;
            font-size: 1rem;
            line-height: 1.6;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .user .message-bubble {
            background-color: var(--msg-user);
            border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
            border: 1px solid var(--border-color);
        }

        .ai .message-bubble {
            background-color: var(--msg-ai);
            border-radius: var(--radius-md);
            /* AI mesajı şeffaf arkaplan, daha makalevari bir okuma sunar */
        }

        /* Markdown Tasarımları */
        .message-bubble p { margin-bottom: 12px; }
        .message-bubble p:last-child { margin-bottom: 0; }
        .message-bubble strong { color: #fff; }
        .message-bubble ul, .message-bubble ol { margin-bottom: 12px; padding-left: 20px; }
        .message-bubble pre {
            background: #000;
            padding: 12px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid var(--border-color);
        }
        .message-bubble code {
            font-family: 'Courier New', Courier, monospace;
            color: #38bdf8;
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .message-bubble pre code { background: transparent; padding: 0; color: #e2e8f0; }

        /* --- İNPUT ALANI --- */
        .input-wrapper {
            padding: 20px 15%;
            background: linear-gradient(to top, var(--bg-main) 70%, transparent);
        }

        .input-box {
            position: relative;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 5px 5px 5px 20px;
            display: flex;
            align-items: flex-end;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s;
        }

        .input-box:focus-within { border-color: var(--primary); }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            line-height: 1.5;
            padding: 12px 0;
            resize: none;
            outline: none;
            max-height: 150px;
            overflow-y: auto;
        }

        textarea::placeholder { color: var(--text-muted); }
        textarea::-webkit-scrollbar { display: none; }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 10px;
            transition: transform 0.2s, background 0.2s;
            flex-shrink: 0;
            margin-bottom: 3px;
            overflow: visible;
        }

        .send-btn-icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transform-origin: center center;
            animation: send-plane-orbit 2.4s linear infinite paused;
        }

        .input-box.is-typing .send-btn:not(:disabled) .send-btn-icon-wrap {
            animation-play-state: running;
        }

        .send-btn:disabled .send-btn-icon-wrap {
            animation: none;
        }

        @keyframes send-plane-orbit {
            from { transform: rotate(0deg) translateY(-4px); }
            to { transform: rotate(360deg) translateY(-4px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .send-btn-icon-wrap {
                animation: none !important;
            }
        }

        .send-btn:hover { background: var(--primary-hover); transform: scale(1.05); }
        .send-btn:disabled { background: var(--border-color); cursor: not-allowed; transform: none; }

        /* Loading Animasyonu */
        .typing { display: flex; gap: 4px; padding: 10px 0; }
        .typing span {
            width: 6px; height: 6px; background: var(--text-muted);
            border-radius: 50%; animation: blink 1.4s infinite both;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

        /* Mobil Uyum */
        @media (max-width: 850px) {
            .chat-container, .input-wrapper { padding-left: 5%; padding-right: 5%; }
            .sidebar {
                position: absolute;
                height: 100%;
                width: 280px;
                transform: translateX(-100%);
                opacity: 1;
                pointer-events: auto;
                border-right: 1px solid var(--border-color);
            }
            .sidebar.open {
                transform: translateX(0);
                box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5);
            }
            body.sidebar-collapsed .sidebar {
                width: 280px;
                opacity: 1;
                pointer-events: auto;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Acıbadem AI</span>
        </div>
        
        <button class="new-chat-btn" onclick="startNewChat()">
            <i class="fa-solid fa-plus"></i> Yeni Sohbet
        </button>

        <div class="history-list" id="historyList">
            {% for s in sessions %}
            <div class="history-item" id="item-{{ s.id }}">
                <div class="history-item-main" onclick="loadChat('{{ s.id }}')">
                    <i class="fa-regular fa-message"></i>
                    <span class="history-item-title">{{ s.title }}</span>
                </div>
                <div class="history-item-menu-wrap" onclick="event.stopPropagation()">
                    <button type="button" class="history-item-kebab" aria-label="Sohbet seçenekleri">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div class="history-dropdown">
                        <button type="button" class="history-delete-btn" onclick="deleteSession('{{ s.id }}', event)">
                            <i class="fa-solid fa-trash"></i>
                            Sil
                        </button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="sidebar-footer">
            <button type="button" class="faq-sidebar-btn" id="faqOpenBtn" onclick="openFaqModal()" aria-haspopup="dialog" aria-controls="faqModal">
                <i class="fa-solid fa-circle-question"></i>
                En çok sorulan sorular
            </button>
        </div>
    </aside>

    <div class="faq-modal-backdrop" id="faqModal" role="dialog" aria-modal="true" aria-labelledby="faqModalTitle" aria-hidden="true" onclick="if (event.target === this) closeFaqModal()">
        <div class="faq-modal-card" onclick="event.stopPropagation()">
            <div class="faq-modal-head">
                <div>
                    <div class="faq-modal-title" id="faqModalTitle">Sık sorulanlar</div>
                    <div class="faq-modal-sub">Bir soru seçin; sohbete gönderilir.</div>
                </div>
                <button type="button" class="faq-modal-close" onclick="closeFaqModal()" aria-label="Kapat">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="faq-q-list">
                <button type="button" class="faq-q-btn" data-question="Ahmet Bulut kimdir?" onclick="sendSuggestedFromFaq(this.getAttribute('data-question'))">
                    1. Ahmet Bulut kimdir?
                </button>
                <button type="button" class="faq-q-btn" data-question="Bilgisayar mühendisliği bölümü kaç yıllıktır?" onclick="sendSuggestedFromFaq(this.getAttribute('data-question'))">
                    2. Bilgisayar mühendisliği bölümü kaç yıllıktır?
                </button>
            </div>
        </div>
    </div>

    <main class="main-content">
        <div class="top-nav">
            <div class="top-nav-left">
                <button type="button" class="menu-toggle" id="menuToggleBtn" onclick="toggleSidebar()" aria-label="Yan menüyü aç veya kapat" aria-expanded="true">
                    <i class="fa-solid fa-bars" id="menuToggleIcon"></i>
                </button>
                <span style="font-weight: 500; font-size: 1.1rem; color: var(--text-muted);">Asistan</span>
            </div>
            <button type="button" class="export-chat-btn" id="exportChatBtn" onclick="exportChatAsText()" title="Sohbeti düz metin olarak panoya kopyala" aria-label="Sohbeti dışarı aktar">
                <i class="fa-solid fa-arrow-up-from-bracket" aria-hidden="true"></i>
                <span class="export-chat-btn-label">Sohbeti dışarı aktar</span>
            </button>
        </div>

        <div class="chat-container" id="chatBox">
            <div class="message-row ai">
                <div class="message-avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="message-column">
                    <div class="message-bubble">
                        <p>Merhaba! Ben Acıbadem Üniversitesi Yapay Zeka Asistanıyım.</p>
                        <p>Size üniversite programları, kayıtlar, ders içerikleri veya iletişim bilgileri hakkında nasıl yardımcı olabilirim?</p>
                    </div>
                    <div class="msg-actions-row">
                        <button type="button" class="msg-copy-btn" onclick="copyMessageText(this)" aria-label="Metni kopyala" title="Kopyala">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-wrapper">
            <div class="input-box">
                <textarea id="userInput" rows="1" placeholder="Asistan'a soru sorun..." oninput="autoResize(this)" onkeydown="handleKeyPress(event)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <span class="send-btn-icon-wrap" aria-hidden="true">
                        <i class="fa-solid fa-paper-plane"></i>
                    </span>
                </button>
            </div>
        </div>
    </main>

    <div id="exportToast" class="export-toast" role="status" aria-live="polite"></div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const sidebar = document.getElementById('sidebar');
        const menuToggleIcon = document.getElementById('menuToggleIcon');
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        let currentSessionId = null;

        function isMobileLayout() {
            return window.innerWidth <= 850;
        }

        function syncSidebarToggleUi() {
            if (!menuToggleBtn || !menuToggleIcon) return;
            if (isMobileLayout()) {
                const open = sidebar.classList.contains('open');
                menuToggleBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
                menuToggleIcon.className = open ? 'fa-solid fa-xmark' : 'fa-solid fa-bars';
            } else {
                const collapsed = document.body.classList.contains('sidebar-collapsed');
                menuToggleBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                menuToggleIcon.className = collapsed ? 'fa-solid fa-bars' : 'fa-solid fa-angles-left';
            }
        }

        // Masaüstü: sidebar daralt / genişlet. Mobil: üst üste drawer aç/kapa.
        function toggleSidebar() {
            if (isMobileLayout()) {
                sidebar.classList.toggle('open');
            } else {
                document.body.classList.toggle('sidebar-collapsed');
            }
            syncSidebarToggleUi();
        }

        function closeSidebarMobile() {
            if (!isMobileLayout()) return;
            sidebar.classList.remove('open');
            syncSidebarToggleUi();
        }

        window.addEventListener('resize', () => {
            if (isMobileLayout()) {
                document.body.classList.remove('sidebar-collapsed');
            } else {
                sidebar.classList.remove('open');
            }
            syncSidebarToggleUi();
        });

        syncSidebarToggleUi();
        syncSendPlaneTypingState();

        function openFaqModal() {
            const modal = document.getElementById('faqModal');
            if (!modal) return;
            modal.classList.add('is-open');
            modal.setAttribute('aria-hidden', 'false');
            const firstQ = modal.querySelector('.faq-q-btn');
            if (firstQ) firstQ.focus();
        }

        function closeFaqModal(restoreFocus = true) {
            const modal = document.getElementById('faqModal');
            if (!modal) return;
            modal.classList.remove('is-open');
            modal.setAttribute('aria-hidden', 'true');
            if (restoreFocus) {
                const opener = document.getElementById('faqOpenBtn');
                if (opener) opener.focus();
            }
        }

        function sendSuggestedFromFaq(question) {
            if (!question || !String(question).trim()) return;
            closeFaqModal(false);
            closeSidebarMobile();
            userInput.value = String(question).trim();
            autoResize(userInput);
            sendMessage();
        }

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('faqModal');
            if (!modal || !modal.classList.contains('is-open')) return;
            if (e.key === 'Escape') {
                e.preventDefault();
                closeFaqModal();
            }
        });

        // Textarea otomatik boyutlandırma
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 150) + 'px';
            syncSendPlaneTypingState();
        }

        function syncSendPlaneTypingState() {
            const box = document.querySelector('.input-box');
            if (!box || !userInput) return;
            if (userInput.value.trim().length > 0) {
                box.classList.add('is-typing');
            } else {
                box.classList.remove('is-typing');
            }
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function copyMessageText(btn) {
            const col = btn.closest('.message-column');
            if (!col) return;
            const bubble = col.querySelector('.message-bubble');
            if (!bubble) return;
            const text = bubble.innerText || '';
            const icon = btn.querySelector('i');
            navigator.clipboard.writeText(text).then(() => {
                btn.classList.add('copied');
                if (icon) {
                    icon.className = 'fa-solid fa-check';
                }
                setTimeout(() => {
                    btn.classList.remove('copied');
                    if (icon) {
                        icon.className = 'fa-regular fa-copy';
                    }
                }, 1600);
            }).catch(() => { /* sessiz */ });
        }

        function showExportToast(msg) {
            const el = document.getElementById('exportToast');
            if (!el) return;
            el.textContent = msg;
            el.classList.add('is-visible');
            clearTimeout(el._hideTimer);
            el._hideTimer = setTimeout(() => el.classList.remove('is-visible'), 2800);
        }

        function buildChatExportFromDom() {
            const lines = [];
            chatBox.querySelectorAll('.message-row').forEach((row) => {
                if (row.id === 'typingIndicator') return;
                const bubble = row.querySelector('.message-column .message-bubble');
                if (!bubble) return;
                const t = (bubble.innerText || '').trim();
                if (!t) return;
                if (row.classList.contains('user')) {
                    lines.push(`Kullanıcı:\n${t}`);
                } else if (row.classList.contains('ai')) {
                    lines.push(`Asistan:\n${t}`);
                }
            });
            return lines.join('\n\n—\n\n');
        }

        async function exportChatAsText() {
            const btn = document.getElementById('exportChatBtn');
            let text = '';

            if (currentSessionId) {
                try {
                    const res = await fetch(`/api/history/${currentSessionId}/`);
                    if (res.ok) {
                        const data = await res.json();
                        const msgs = data.messages || [];
                        if (msgs.length) {
                            const parts = [];
                            msgs.forEach((m) => {
                                parts.push(
                                    `Kullanıcı:\n${(m.user_message || '').trim()}\n\nAsistan:\n${(m.ai_response || '').trim()}`
                                );
                            });
                            text = parts.join('\n\n—\n\n');
                        }
                    }
                } catch (_) { /* DOM yedeği */ }
            }

            if (!text.trim()) {
                text = buildChatExportFromDom();
            }

            if (!text.trim()) {
                showExportToast('Dışa aktarılacak mesaj bulunamadı.');
                return;
            }

            const header = 'Acıbadem AI Asistanı — sohbet özeti\n============================\n\n';
            const body = header + text.trim();

            if (btn) btn.disabled = true;
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(body);
                } else {
                    throw new Error('no-clipboard');
                }
                showExportToast('Sohbet metni panoya kopyalandı.');
            } catch (_) {
                const ta = document.createElement('textarea');
                ta.value = body;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showExportToast('Sohbet metni panoya kopyalandı.');
                } catch (e2) {
                    showExportToast('Kopyalanamadı. Tarayıcı izni verin veya metni elle kopyalayın.');
                }
                document.body.removeChild(ta);
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        async function deleteSession(id, ev) {
            ev.stopPropagation();
            try {
                const response = await fetch(`/api/session/${id}/`, { method: 'DELETE' });
                if (!response.ok && response.status !== 404) return;
                document.getElementById(`item-${id}`)?.remove();
                if (currentSessionId === id) {
                    currentSessionId = null;
                    startNewChat();
                }
            } catch (_) { /* sessiz */ }
        }

        function startNewChat() {
            currentSessionId = null;
            chatBox.innerHTML = `
                <div class="message-row ai">
                    <div class="message-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="message-column">
                        <div class="message-bubble"><p>Yeni bir sohbet başlattınız. Sizi dinliyorum.</p></div>
                        <div class="msg-actions-row">
                            <button type="button" class="msg-copy-btn" onclick="copyMessageText(this)" aria-label="Metni kopyala" title="Kopyala">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
            document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
            closeSidebarMobile();
        }

        async function loadChat(id) {
            currentSessionId = id;
            document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
            document.getElementById(`item-${id}`).classList.add('active');
            
            closeSidebarMobile();

            chatBox.innerHTML = '<div style="text-align:center; color: var(--text-muted); margin-top: 40px;"><div class="typing"><span></span><span></span><span></span></div></div>';
            
            try {
                const response = await fetch(`/api/history/${id}/`);
                const data = await response.json();
                
                chatBox.innerHTML = "";
                data.messages.forEach(m => {
                    appendUserMessage(m.user_message);
                    appendAIMessage(m.ai_response, true);
                });
                scrollToBottom();
            } catch (error) {
                chatBox.innerHTML = '<div style="color:#ef4444; text-align:center; margin-top: 20px;">Geçmiş yüklenemedi.</div>';
            }
        }

        function appendUserMessage(text) {
            const html = `
                <div class="message-row user">
                    <div class="message-column">
                        <div class="message-bubble">${escapeHTML(text)}</div>
                        <div class="msg-actions-row">
                            <button type="button" class="msg-copy-btn" onclick="copyMessageText(this)" aria-label="Metni kopyala" title="Kopyala">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', html);
        }

        function appendAIMessage(text, isParsed=false) {
            const content = isParsed ? marked.parse(text) : text;
            const html = `
                <div class="message-row ai">
                    <div class="message-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="message-column">
                        <div class="message-bubble ai-content">${content}</div>
                        <div class="msg-actions-row">
                            <button type="button" class="msg-copy-btn" onclick="copyMessageText(this)" aria-label="Metni kopyala" title="Kopyala">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', html);
            return chatBox.lastElementChild.querySelector('.ai-content');
        }

        function appendTypingIndicator() {
            const html = `
                <div class="message-row ai" id="typingIndicator">
                    <div class="message-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="message-column">
                        <div class="message-bubble"><div class="typing"><span></span><span></span><span></span></div></div>
                    </div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', html);
        }

        async function sendMessage() {
            const question = userInput.value.trim();
            if (!question) return;

            // UI Durumunu kilitle
            userInput.value = "";
            autoResize(userInput);
            sendBtn.disabled = true;
            
            appendUserMessage(question);
            appendTypingIndicator();
            scrollToBottom();

            try {
                const response = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, session_id: currentSessionId })
                });

                document.getElementById('typingIndicator')?.remove();

                if (!response.ok) {
                    let errDetail = 'Sunucu hatası';
                    try {
                        const errBody = await response.json();
                        if (errBody && errBody.error) errDetail = errBody.error;
                    } catch (_) { /* yok */ }
                    throw new Error(errDetail);
                }

                const newSessionId = response.headers.get('X-Session-ID');
                const isFirstMessage = !currentSessionId && newSessionId;
                if (isFirstMessage) currentSessionId = newSessionId;

                const msgContentDiv = appendAIMessage('', false);
                if (!msgContentDiv) throw new Error('Mesaj balonu oluşturulamadı.');

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    fullText += decoder.decode(value, { stream: true });
                    msgContentDiv.innerHTML = marked.parse(fullText);
                    scrollToBottom();
                }

                if (isFirstMessage) {
                    setTimeout(() => location.reload(), 1500); 
                }

            } catch (error) {
                document.getElementById('typingIndicator')?.remove();
                const errMsg = (error && error.message) ? escapeHTML(error.message) : 'Sunucuya bağlanılamadı veya bir hata oluştu.';
                appendAIMessage(`<span style='color:#ef4444;'>${errMsg}</span>`, false);
            } finally {
                sendBtn.disabled = false;
                scrollToBottom();
                syncSendPlaneTypingState();
            }
        }

        function handleKeyPress(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
