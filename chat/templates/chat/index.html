<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acıbadem AI Asistanı</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary-color: #1a73e8; /* Daha modern ve parlak bir mavi (Aksan Rengi) */
            --primary-hover: #1557b0;
            --bg-color: #121212; /* En arka plan (Tam koyu) */
            --chat-bg: #1e1e1e; /* Chat kutusu arka planı (Koyu Gri) */
            --user-msg-bg: #2b5278; /* Kullanıcı mesajı için tok bir gece mavisi */
            --ai-msg-bg: #2d2d2d; /* AI mesajı için modern gri */
            --text-color: #e0e0e0; /* Ana metin rengi (Göz yormayan kırık beyaz) */
            --text-muted: #888888; /* Placeholder ve silik metinler */
            --border-color: #333333; /* Modern ince ayırıcı çizgiler */
            --border-radius: 16px;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }

        .chat-container { 
            width: 100%; 
            max-width: 800px; 
            height: 90vh;
            background: var(--chat-bg); 
            border-radius: 12px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden; 
            border: 1px solid var(--border-color);
        }

        .header { 
            background: #161b22;
            color: #ffffff; 
            padding: 18px; 
            text-align: center; 
            font-size: 1.3em; 
            font-weight: 600; 
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        .chat-box { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            background-color: var(--chat-bg);
            scroll-behavior: smooth;
        }

        .message-wrapper {
            display: flex;
            margin-bottom: 20px;
            width: 100%;
        }

        .message-wrapper.user { justify-content: flex-end; }
        .message-wrapper.ai { justify-content: flex-start; }

        .message { 
            max-width: 75%; 
            padding: 14px 18px; 
            border-radius: var(--border-radius); 
            line-height: 1.6; 
            font-size: 0.95em;
            color: var(--text-color);
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .user-msg { 
            background-color: var(--user-msg-bg); 
            border-bottom-right-radius: 4px;
            color: #ffffff;
        }

        .ai-msg { 
            background-color: var(--ai-msg-bg); 
            border-bottom-left-radius: 4px;
        }


        .ai-msg p { margin: 0 0 10px 0; }
        .ai-msg p:last-child { margin: 0; }
        .ai-msg ul, .ai-msg ol { margin: 5px 0; padding-left: 20px; }
        .ai-msg strong { color: #ffffff; font-weight: 700; }
        .ai-msg code { 
            background: #1a1a1a; 
            color: #58a6ff;
            padding: 3px 6px; 
            border-radius: 6px; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 0.9em; 
            border: 1px solid #333;
        }

        .input-area { 
            display: flex; 
            padding: 15px 20px; 
            background: #161b22; 
            border-top: 1px solid var(--border-color);
            align-items: flex-end;
            gap: 12px;
        }

        textarea { 
            flex: 1; 
            padding: 14px 16px; 
            background: #0d1117;
            color: var(--text-color);
            border: 1px solid var(--border-color); 
            border-radius: 20px; 
            outline: none; 
            resize: none;
            font-family: inherit;
            font-size: 1em;
            min-height: 24px;
            max-height: 120px;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        textarea::placeholder { color: var(--text-muted); }
        textarea:focus { border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2); }

        button { 
            background: var(--primary-color); 
            color: white; 
            border: none; 
            padding: 0 24px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 1em;
            height: 50px;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { background: var(--primary-hover); }
        button:active { transform: scale(0.96); }


        .typing-indicator {
            display: none;
            padding: 16px 20px;
            background: var(--ai-msg-bg);
            border-radius: var(--border-radius);
            border-bottom-left-radius: 4px;
            align-items: center;
            width: fit-content;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .dot {
            width: 8px;
            height: 8px;
            margin: 0 3px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }


        @media (max-width: 600px) {
            .chat-container { height: 100vh; border-radius: 0; border: none; }
            .message { max-width: 85%; }
            .input-area { padding: 10px 15px; }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">Acıbadem AI Asistanı</div>
    <div class="chat-box" id="chatBox">
        <div class="message-wrapper ai">
            <div class="message ai-msg">Merhaba! Ben Acıbadem Üniversitesi yapay zeka asistanıyım. Size nasıl yardımcı olabilirim?</div>
        </div>
    </div>
    
    <div class="chat-box" style="padding-top: 0; padding-bottom: 0; flex: 0; overflow: visible; min-height: 0;">
        <div class="typing-indicator" id="typingIndicator">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="input-area">
        <textarea id="userInput" placeholder="Sorunuzu buraya yazın..." rows="1" oninput="autoResize(this)" onkeydown="handleKeyPress(event)"></textarea>
        <button onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const typingIndicator = document.getElementById('typingIndicator');


    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = (textarea.scrollHeight) + 'px';
        if(textarea.value === '') textarea.style.height = 'auto';
    }
    
    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const question = userInput.value.trim();
        if (question === "") return;
        
        chatBox.innerHTML += `
            <div class="message-wrapper user">
                <div class="message user-msg">${escapeHTML(question)}</div>
            </div>`;
        
        userInput.value = "";
        autoResize(userInput);
        scrollToBottom();
        typingIndicator.style.display = "flex";

        try {
            const response = await fetch('/api/chat/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question })
            });
            
            typingIndicator.style.display = "none";

            if (!response.ok) {
                throw new Error("Sunucu hatası");
            }


            const msgWrapper = document.createElement('div');
            msgWrapper.className = 'message-wrapper ai';
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai-msg';
            msgWrapper.appendChild(msgDiv);
            chatBox.appendChild(msgWrapper);


            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let fullText = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                fullText += chunk;
                

                msgDiv.innerHTML = marked.parse(fullText);
                scrollToBottom();
            }

        } catch (error) {
            typingIndicator.style.display = "none";
            chatBox.innerHTML += `
                <div class="message-wrapper ai">
                    <div class="message ai-msg" style="color:#ff6b6b; font-weight:bold;">Sunucuya bağlanılamadı veya bir hata oluştu.</div>
                </div>`;
            scrollToBottom();
        }
    }

    function handleKeyPress(event) {

        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }
</script>

</body>
</html>
