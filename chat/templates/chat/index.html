<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acıbadem AI Asistanı</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #eef2f7, #dfe9f3);
            margin: 0;
            padding: 20px;
        }

        .chat-container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: #004a8f;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
        }

        .chat-box {
            height: 420px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .message {
            margin: 10px 0;
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 15px;
            line-height: 1.4;
        }

        .user-msg {
            align-self: flex-end;
            background: #004a8f;
            color: white;
        }

        .ai-msg {
            align-self: flex-start;
            background: #e9f1fb;
            color: #333;
        }

        .input-area {
            display: flex;
            padding: 10px;
            background: #f0f0f0;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            outline: none;
        }

        button {
            background: #004a8f;
            color: white;
            border: none;
            padding: 10px 18px;
            margin-left: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #003366;
        }

        .loading {
            font-style: italic;
            color: #777;
            font-size: 0.9em;
            display: none;
        }
    </style>
</head>

<body>

<div class="chat-container">
    <div class="header">🤖 Acıbadem AI Asistanı</div>

    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">
            Merhaba! Ben Acıbadem Üniversitesi yapay zeka asistanıyım. Size nasıl yardımcı olabilirim?
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Sorunuzu buraya yazın..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <div style="text-align: center; padding: 5px;">
        <span class="loading" id="loadingText">🤖 Asistan düşünüyor...</span>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const loadingText = document.getElementById('loadingText');

        const question = inputField.value.trim();
        if (question === "") return;

        // kullanıcı mesajı
        chatBox.innerHTML += `<div class="message user-msg">${question}</div>`;
        inputField.value = "";
        inputField.focus();

        loadingText.style.display = "block";
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/api/chat/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question })
            });

            const data = await response.json();

            if (data.answer) {
                chatBox.innerHTML += `<div class="message ai-msg">${data.answer}</div>`;
            } else {
                chatBox.innerHTML += `<div class="message ai-msg" style="color:red;">Hata: ${data.error}</div>`;
            }

        } catch (error) {
            chatBox.innerHTML += `<div class="message ai-msg" style="color:red;">Sunucuya bağlanılamadı.</div>`;
        }

        loadingText.style.display = "none";
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
