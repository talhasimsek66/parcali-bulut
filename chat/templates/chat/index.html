<!DOCTYPE html>
{% load static %}
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acıbadem AI Asistanı</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #eef2f7, #dfe9f3);
            margin: 0;
            padding: 20px;
        }

        .chat-container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: #004a8f;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
        }

        .chat-box {
            height: 420px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .message {
            margin: 10px 0;
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 15px;
            line-height: 1.4;
        }

        .user-msg {
            align-self: flex-end;
            background: #004a8f;
            color: white;
        }

        .ai-msg {
            align-self: flex-start;
            background: #e9f1fb;
            color: #333;
        }

        .input-area {
            display: flex;
            padding: 10px;
            background: #f0f0f0;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            outline: none;
        }

        button {
            background: #004a8f;
            color: white;
            border: none;
            padding: 10px 18px;
            margin-left: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #003366;
        }

        .loading {
            font-style: italic;
            color: #777;
            font-size: 0.9em;
            display: none;
        }
    </style>
</head>

<body>

<div class="chat-container">
    <div class="header">🤖 Acıbadem AI Asistanı</div>

    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">
            Merhaba! Ben Acıbadem Üniversitesi yapay zeka asistanıyım. Size nasıl yardımcı olabilirim?
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Sorunuzu buraya yazın..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <div style="text-align: center; padding: 5px;">
        <span class="loading" id="loadingText">🤖 Asistan düşünüyor...</span>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const welcomeScreen = document.getElementById('welcomeScreen');

    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    function appendMessage(role, text) {
        if (welcomeScreen) welcomeScreen.style.display = 'none';

        const row = document.createElement('div');
        row.className = `message-row ${role === 'ai' ? 'ai-row' : 'user-row'}`;

        const avatarIcon = role === 'ai' ? '<i class="fa-solid fa-robot"></i>' : '<i class="fa-solid fa-user"></i>';
        const avatarClass = role === 'ai' ? 'ai-avatar' : 'user-avatar';

        row.innerHTML = `
            <div class="message-content">
                <div class="avatar ${avatarClass}">${avatarIcon}</div>
                <div class="text">${text}</div>
            </div>
        `;
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const loadingText = document.getElementById('loadingText');

        const question = inputField.value.trim();
        if (question === "") return;

        // kullanıcı mesajı
        chatBox.innerHTML += `<div class="message user-msg">${question}</div>`;
        inputField.value = "";
        inputField.focus();

        loadingText.style.display = "block";
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/api/chat/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({ question: question })
            });
            const data = await response.json();

            if (data.answer) {
                chatBox.innerHTML += `<div class="message ai-msg">${data.answer}</div>`;
            } else {
                chatBox.innerHTML += `<div class="message ai-msg" style="color:red;">Hata: ${data.error}</div>`;
            }

        } catch (error) {
            chatBox.innerHTML += `<div class="message ai-msg" style="color:red;">Sunucuya bağlanılamadı.</div>`;
        }
    }

    // Hem tıklama hem Enter için dinleyiciler
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>
</body>
</html>
